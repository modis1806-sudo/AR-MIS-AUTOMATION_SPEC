[project]
name = "ar-mis-pipeline"
version = "0.1.0"
description = "Tally extraction and AR MIS reporting pipeline"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools]
packages = ["ar_mis", "ar_mis.webapp"]

[tool.setuptools.package-data]
"ar_mis.webapp" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
