[project]
name = "ar-mis-pipeline"
version = "0.1.0"
description = "Tally extraction and AR MIS reporting pipeline"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.setuptools]
packages = ["ar_mis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
